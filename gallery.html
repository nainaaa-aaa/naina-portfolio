<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Naina Gupta</title>
<meta name="description" content="An infinite, draggable gallery of side projects, experiments, and photos by Naina Gupta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; }
    a { color: #4A2A6B; }
    a:hover { color: #A66BFF; }
    @keyframes nudgeX { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
</head>
<body>
<div id="viewRef" style="position:fixed; inset:0; overflow:hidden; background:#FFFFFF; cursor:grab; font-family:'DM Sans',sans-serif; touch-action:none;
  background-image:radial-gradient(rgba(58,32,84,.20) 1.4px, transparent 1.4px); background-size:24px 24px;">

  <!-- infinite field: this tile is cloned into a 3×3 lattice by the logic -->
  <div id="fieldRef" style="position:absolute; left:0; top:0; width:0; height:0; will-change:transform;">

      <div style="position:absolute; left:120px; top:140px; width:280px; transform:rotate(-6deg); background:#FFFFFF; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#F2EFE7; height:210px; overflow:hidden;"><img src="assets/me.png" alt="self portrait" style="width:100%; height:100%; object-fit:cover; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>SELF, 35MM</span><span>001</span></div>
      </div>

      <div style="position:absolute; left:780px; top:60px; width:260px; transform:rotate(5deg); background:#63E3C2; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#E3FAF3; height:190px; display:flex; align-items:center; justify-content:center;"><img src="assets/lilies.png" alt="lilies" style="max-width:84%; max-height:84%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>LILY STUDY</span><span>002</span></div>
      </div>

      <div style="position:absolute; left:1560px; top:180px; width:250px; transform:rotate(3deg); background:#C4E75A; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#F4FBDD; height:180px; display:flex; align-items:center; justify-content:center;"><img src="assets/crochet.png" alt="crochet" style="max-width:84%; max-height:84%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>CROCHET LOGS</span><span>003</span></div>
      </div>

      <div style="position:absolute; left:2060px; top:620px; width:268px; transform:rotate(-4deg); background:#A66BFF; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#F1E8FF; height:196px; display:flex; align-items:center; justify-content:center;"><img src="assets/chaipaglu.png" alt="chai" style="max-width:84%; max-height:84%; display:block;"></div>

      </div>

      <div style="position:absolute; left:1180px; top:780px; width:240px; transform:rotate(2deg); background:#FF7EB6; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#FFEAF3; height:172px; display:flex; align-items:center; justify-content:center;"><img src="assets/folder.png" alt="travel junk" style="max-width:80%; max-height:80%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>TRAVEL JUNK</span><span>005</span></div>
      </div>

      <div style="position:absolute; left:300px; top:760px; width:288px; transform:rotate(-2deg); background:#F9C846; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#FFF7DF; height:198px; display:flex; align-items:center; justify-content:center;"><img src="assets/experiments.png" alt="pixel scene" style="max-width:86%; max-height:86%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>PIXEL SCENE</span><span>006</span></div>
      </div>

      <div style="position:absolute; left:760px; top:1320px; width:250px; transform:rotate(7deg); background:#FFFFFF; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#F2EFE7; height:180px; display:flex; align-items:center; justify-content:center;"><img src="assets/lilies.png" alt="lily off-cut" style="max-width:80%; max-height:80%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>OFF-CUT</span><span>007</span></div>
      </div>

      <div style="position:absolute; left:1720px; top:1300px; width:268px; transform:rotate(-7deg); background:#FFFFFF; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">
        <div style="border:2px solid #121212; background:#F2EFE7; height:196px; display:flex; align-items:center; justify-content:center;"><img src="assets/experiments.png" alt="pixel offcut" style="max-width:84%; max-height:84%; display:block;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.2px; color:#121212;"><span>UNFILED</span><span>008</span></div>
      </div>

      <div style="position:absolute; left:150px; top:470px; font-family:'Caveat',cursive; font-size:26px; color:#4A2A6B; transform:rotate(-4deg); pointer-events:none;">this one took 3 nights ✎</div>
      <div style="position:absolute; left:1500px; top:700px; font-family:'Caveat',cursive; font-size:24px; color:#4A2A6B; transform:rotate(3deg); pointer-events:none;">still unfinished, still favourite</div>
      <div style="position:absolute; left:1120px; top:1620px; font-family:'Caveat',cursive; font-size:23px; color:#6A4A8A; transform:rotate(-8deg); pointer-events:none;">keep going →</div>
      <div style="position:absolute; left:2060px; top:1080px; font-family:'Caveat',cursive; font-size:23px; color:#6A4A8A; transform:rotate(6deg); pointer-events:none;">← more this way</div>

      <div style="position:absolute; left:640px; top:340px; width:14px; height:14px; background:#F9C846; border:2px solid #121212;"></div>
      <div style="position:absolute; left:1960px; top:900px; width:14px; height:14px; background:#63E3C2; border:2px solid #121212; transform:rotate(20deg);"></div>
      <div style="position:absolute; left:420px; top:1480px; width:14px; height:14px; background:#FF7EB6; border:2px solid #121212;"></div>
      <div style="position:absolute; left:1420px; top:120px; width:14px; height:14px; background:#A66BFF; border:2px solid #121212; transform:rotate(15deg);"></div>
    </div>
  </div>

  <!-- CENTRE TEXT — drifts a little, never leaves -->
  <div id="textRef" style="position:absolute; left:50%; top:50%; z-index:6; width:620px; margin-left:-310px; transform:translateY(-50%); text-align:center; pointer-events:none;">
    <p style="margin:0 0 14px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#6A4A8A;"><span style="background:#FFFFFF; padding:4px 8px;">Life on a regular day</span></p>
    <h1 style="margin:0; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(38px,4.4vw,62px); line-height:1; letter-spacing:-2.4px; color:#1A1209;"><span style="background:#FFFFFF; padding:4px 10px; display:inline-block;">The gallery has</span><br><span style="background:#FFFFFF; padding:4px 10px; display:inline-block;">no straight walls.</span></h1>
  </div>

  <!-- NAV — same header as the home page -->
  <nav style="position:fixed; top:0; left:0; right:0; z-index:12; display:flex; align-items:center; justify-content:space-between; padding:26px 60px;">
    <a href="index.html" style="text-decoration:none;">
      <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:#1A1209; letter-spacing:-.5px;">naina.</span>
    </a>
    <div style="display:flex; gap:34px; align-items:flex-end;">
      <a href="index.html" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:14px; font-weight:500; color:#2A2030; letter-spacing:.15px; transition:opacity .2s;" data-hover="opacity:.55;">Home<span style="display:block; width:100%; height:3px; background:transparent;"></span></a>
      <a href="#" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:14px; font-weight:600; color:#1A1209; letter-spacing:.15px; transition:opacity .2s;" data-hover="opacity:.55;">Gallery<span style="display:block; width:100%; height:3px; background:#121212;"></span></a>
      <a href="index.html#contact" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:14px; font-weight:500; color:#2A2030; letter-spacing:.15px; transition:opacity .2s;" data-hover="opacity:.55;">Contact<span style="display:block; width:100%; height:3px; background:transparent;"></span></a>
    </div>
  </nav>

  <div style="position:fixed; bottom:24px; right:28px; z-index:12; display:flex; align-items:center; gap:12px; padding:10px 16px; background:#3A2054; color:#F1EDE3; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px;">
    <span id="coordRef">0, 0</span>
    <span style="width:9px; height:9px; background:#63E3C2; border:1.5px solid #F1EDE3;"></span>
  </div>
