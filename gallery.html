<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Naina Gupta, Product Designer</title>
<meta name="description" content="An infinite, draggable gallery of photos, crochet and side projects by Naina Gupta, Product Designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; overscroll-behavior: none; }
  a { color: #4A2A6B; }
  a:hover { color: #A66BFF; }
  /* The canvas is a drag surface, so panning must never start a text or
     image selection. Links and the recenter button still work normally. */
  #viewRef {
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  #viewRef.dragging { cursor: grabbing; }
  #viewRef img {
    -webkit-user-drag: none;
    user-drag: none;
  }
  /* ── tic-tac-toe ─────────────────────────────────────────── */
  .ttt-card {
    background: #FFFFFF; border: 3px solid #121212; box-shadow: 8px 10px 0 #121212;
    padding: 12px; transform: rotate(-1.1deg);
  }
  .ttt-top {
    display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: #121212;
  }
  .ttt-status { color: #6A4A8A; }
  .ttt-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    background: #121212; border: 2px solid #121212; padding: 6px;
  }
  .ttt-c {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: #EFEAE0; border: 0; padding: 0; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px;
    line-height: 1; color: #121212; transition: background .15s;
  }
  .ttt-c:hover:not(:disabled) { background: #63E3C2; }
  .ttt-c:disabled { cursor: default; }
  .ttt-c.x { color: #121212; }
  .ttt-c.o { color: #A66BFF; }
  .ttt-c.win { background: #F9C846; }
  .ttt-c:focus-visible { outline: 3px solid #A66BFF; outline-offset: -3px; }
  .ttt-reset {
    width: 100%; margin-top: 10px; padding: 7px; cursor: pointer;
    background: #F9C846; border: 2px solid #121212; box-shadow: 3px 3px 0 #121212;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 1.4px; text-transform: uppercase; color: #121212;
  }
  .ttt-reset:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #121212; }

  /* ── rock paper scissors ─────────────────────────────────── */
  .rps-card {
    background: #FFFFFF; border: 3px solid #121212; box-shadow: 8px 10px 0 #121212;
    padding: 12px; transform: rotate(1.4deg);
  }
  .rps-top {
    display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: #121212;
  }
  .rps-score { color: #6A4A8A; }
  .rps-throw {
    display: flex; align-items: center; justify-content: space-between;
    background: #EFEAE0; border: 2px solid #121212; padding: 12px 14px;
  }
  .rps-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rps-face { font-size: 34px; line-height: 1; }
  .rps-face.me { transform: scaleX(-1); }
  .rps-lbl {
    font-family: 'IBM Plex Mono', monospace; font-size: 8.5px;
    letter-spacing: 1.2px; color: #6A4A8A;
  }
  .rps-vs {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 1.4px; color: #121212;
  }
  .rps-msg {
    margin: 10px 0 0; text-align: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 1.2px; text-transform: uppercase; color: #121212;
  }
  .rps-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .rps-b {
    padding: 8px 0; cursor: pointer; font-size: 22px; line-height: 1;
    background: #F9C846; border: 2px solid #121212; box-shadow: 3px 3px 0 #121212;
  }
  .rps-b:hover { background: #63E3C2; }
  .rps-b:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #121212; }
  .rps-b:focus-visible { outline: 3px solid #A66BFF; outline-offset: 2px; }

  #recenterBtn:focus-visible { outline: 3px solid #A66BFF; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #fieldRef, #headingRef { transition: none !important; }
  }
</style>
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="responsive.css">
<script src="nav.js" defer></script>
</head>
<body>

        <div style="border:2px solid #121212; background:#EFEAE0; height:288px; overflow:hidden;"><img src="assets/gallery/making-friends.jpg" alt="A small crocheted yellow chick sitting in the palm of a hand" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;"></div>
        <figcaption style="display:flex; justify-content:space-between; gap:10px; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; color:#121212;"><span>MAKING FRIENDS</span><span>007</span></figcaption>

        <div style="border:2px solid #121212; background:#EFEAE0; height:168px; overflow:hidden;"><img src="assets/gallery/standout-performer-goldenflitch.jpg" alt="Naina holding a glass award in front of a Goldenflitch anniversary backdrop" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;"></div>
        <figcaption style="display:flex; justify-content:space-between; gap:10px; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; color:#121212;"><span>FOUR YEARS IN</span><span>008</span></figcaption>
      </figure>
      <figure style="position:absolute; left:582px; top:1259px; width:230px; margin:0; transform:rotate(-2.9deg); background:#F9C846; border:3px solid #121212; box-shadow:8px 10px 0 #121212; padding:12px 12px 14px; transition:transform .3s cubic-bezier(.2,.85,.3,1.05), box-shadow .3s ease;" data-hover="transform:rotate(0deg) scale(1.04); box-shadow:14px 18px 0 #121212;">

  <!-- The one and only heading. Sits at the tile's centre and pans with the
       artwork, but exists exactly once. -->

  <!-- Recenter, bottom-right. -->

    Recenter
  </button>
</div>

</body>
</html>
